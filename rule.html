<style>
  :root {
    --bg:#f5f5f5;--surface:#ffffff;--surface2:#eeeeee;
    --border:#d4d4d4;--accent:#333333;--accent2:#666666;
    --text:#1a1a1a;--text-muted:#888888;--r18:#c04040;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New",sans-serif;min-height:100vh;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 24px 14px;position:static;}
  .header-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .header-title{font-family:"Noto Serif JP",serif;font-size:20px;letter-spacing:.05em;color:var(--accent);}
  .header-sub{font-size:11px;color:var(--text-muted);margin-top:2px;letter-spacing:.08em;}
  .header-btns{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .btn{background:rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.4);color:var(--accent);padding:5px 12px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s;white-space:nowrap;}
  .btn:hover{background:rgba(0,0,0,.22);}

  .main{padding:20px 24px 60px;max-width:900px;margin:0 auto;}

  /* 閲覧表示 */
  .rule-view{background:transparent;border:none;border-radius:0;padding:0;line-height:1;font-size:11px;font-family:"Zen Kaku Gothic New",sans-serif;}

  .rule-sec{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:14px;}
  .rule-sec-head{font-size:16px;font-weight:700;color:#000000;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);line-height:1.6;}

  /* ---- 項目・メーター ---- */
  .rule-item{padding:8px 0;}
  .rule-item-name{font-weight:700;font-size:13px;margin-bottom:6px;padding-left:10px;border-left:3px solid #ff0000;}
  .rule-item-val{padding-left:13px;}
  .rule-item-text{font-size:11px;line-height:1.15;word-break:break-word;}
  .meter-wrap{width:100%;}
  .meter-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-muted);margin-bottom:5px;line-height:1.4;}
  .meter-labels .right{text-align:right;}
  .meter{display:flex;gap:2px;width:100%;height:14px;}
  .meter .seg{flex:1 1 0;border:1px solid #c6c6c6;background:#ececec;cursor:pointer;padding:0;border-radius:2px;}
  .meter .seg:first-child{border-top-left-radius:7px;border-bottom-left-radius:7px;}
  .meter .seg:last-child{border-top-right-radius:7px;border-bottom-right-radius:7px;}
  .meter .seg.on{background:#8b0000;border-color:#6b0000;}
  .rule-view-meter .seg{cursor:default;pointer-events:none;}
  .ed-item{border:1px dashed var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;}
  .ed-item-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .ed-item-top select,.ed-item-top input{border:1px solid var(--border);border-radius:5px;padding:4px 7px;font-size:12px;font-family:inherit;background:#fff;color:var(--text);}
  .ed-item-top input.it-name{flex:1 1 140px;min-width:100px;}
  .ed-item-top input.it-lb{flex:1 1 90px;min-width:70px;}
  .ed-item-mini{background:#fff;border:1px solid var(--border);border-radius:5px;width:26px;height:26px;font-size:11px;cursor:pointer;flex-shrink:0;}
  .ed-item-del{background:#fff;border:1px solid var(--border);border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;color:#8b0000;flex-shrink:0;}
  .add-item-btn{width:100%;background:#fff;border:1px dashed var(--border);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;color:var(--text-muted);margin-top:4px;}

  .rule-view h1{font-size:20px;font-weight:700;color:#000000;margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border);line-height:2.0;}
  .rule-view h1:first-child{margin-top:0;}

.colorbar-fixed{position:fixed;left:0;right:0;z-index:1150;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:#ffffff;border-bottom:1px solid #d4d4d4;box-shadow:0 3px 12px rgba(0,0,0,.10);padding:8px 12px}

<script>
const IS_EDIT_MODE = new URLSearchParams(location.search).get('edit') === '1';
const GH_REPO='8i10/EiThiophile', GH_BRANCH='main', GH_FILE='rules.json';
const GH_API='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
const GH_TOKEN_KEY='gh_token_v1';
let sections=[]; // [{heading, items:[{id,name,type,value,left,right,level}]}]
const LEVELS=7;
function itemUid(){return 'it'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function normSections(arr){
  return (Array.isArray(arr)?arr:[]).map(function(s){
    s=s||{};
    let items;
    if(Array.isArray(s.items)){
      items=s.items.map(function(it){it=it||{};return{id:it.id||itemUid(),name:it.name||'',type:it.type==='meter'?'meter':'text',value:it.value||'',left:it.left||'',right:it.right||'',level:Number(it.level)||0};});
    }else{
      items=(s.body&&String(s.body).trim())?[{id:itemUid(),name:'',type:'text',value:s.body,left:'',right:'',level:0}]:[];
    }
    return{heading:s.heading||'',items:items};
  });
}
let editing=false;

function getGHToken(){
  var el=document.getElementById('token');
  var v=el&&el.value?el.value.trim():'';
  return v||localStorage.getItem(GH_TOKEN_KEY)||'';
}
function setStatus(m,isErr){
  var el=document.getElementById('status'); if(!el)return;
  el.textContent=m||''; el.className='status'+(isErr?' err':'');
}
function saveGHToken(t){localStorage.setItem(GH_TOKEN_KEY,t);}
function ghHeaders(t){return {'Authorization':'token '+t,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};}
function showLoading(o){document.getElementById('loadingBanner').style.display=o?'flex':'none';}

async function getFileSha(t){const r=await fetch(GH_API+'?t='+Date.now(),{headers:ghHeaders(t)});if(r.status===404)return null;return (await r.json()).sha||null;}
async function apiGet(){const t=getGHToken();const h=t?ghHeaders(t):{'Accept':'application/vnd.github.v3+json'};const r=await fetch(GH_API+'?t='+Date.now(),{headers:h});if(!r.ok)return null;const j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));}
async function apiSave(data){const t=getGHToken();if(!t)throw new Error('トークン未設定');const sha=await getFileSha(t);const body={message:'Update rules.json',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),branch:GH_BRANCH};if(sha)body.sha=sha;const r=await fetch(GH_API,{method:'PUT',headers:ghHeaders(t),body:JSON.stringify(body)});if(!r.ok){const e=await r.json();throw new Error(e.message||'API error');}return await r.json();}

async function loadRules(){
  showLoading(true);
  try{
    const d=await apiGet();
    if(d&&Array.isArray(d.sections))sections=normSections(d.sections);
    else if(d&&typeof d.text==='string'){
      // 旧形式（単一テキスト）を1セクションに変換
      sections=d.text.trim()?normSections([{heading:'',body:d.text}]):[];
    }
  }catch(e){console.warn(e);}
  showLoading(false);
  renderRules();
}

// Discord記法 → HTML
function renderMarkdown(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=src.split('\n');
  let html='',inCode=false,codeBuf=[],inList=false;
  const flushList=()=>{if(inList){html+='</ul>';inList=false;}};
  for(let i=0;i<lines.length;i++){
    let line=lines[i];
    if(line.trim().startsWith('```')){
      if(!inCode){inCode=true;codeBuf=[];}
      else{inCode=false;html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';}
      continue;
    }
    if(inCode){codeBuf.push(line);continue;}
    if(/^# (.*)/.test(line)){flushList();html+='<h1>'+inline(esc(line.replace(/^# /,'')))+'</h1>';continue;}
    if(/^## (.*)/.test(line)){flushList();html+='<h2>'+inline(esc(line.replace(/^## /,'')))+'</h2>';continue;}
    if(/^### (.*)/.test(line)){flushList();html+='<h3>'+inline(esc(line.replace(/^### /,'')))+'</h3>';continue;}
    if(/^> (.*)/.test(line)){
      flushList();
      var qbuf=[inline(esc(line.replace(/^> /,'')))];
      while(i+1<lines.length && /^> /.test(String(lines[i+1]))){ i++; qbuf.push(inline(esc(String(lines[i]).replace(/^> /,'')))); }
      html+='<blockquote>'+qbuf.join('<br>')+'</blockquote>';
      continue;
    }
    if(/^[-*] (.*)/.test(line)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(esc(line.replace(/^[-*] /,'')))+'</li>';continue;}
    flushList();
    if(line.trim()==='')html+='<br>';
    else{
      const m=line.match(/^([ \u3000]+)/);
      let escaped=esc(line);
      if(m){
        const indent=m[1].replace(/ /g,'&nbsp;');
        escaped=indent+esc(line.slice(m[1].length));
      }
      if(/^[\s\u3000*_~\uFF0A\uFF3F\uFF5E\u3001\u30FB]*※/.test(line)){
        var inner=inline(escaped).replace(/<(strong|em|u|s)>/g,'<$1 style="color:#ff0000">');
        html+='<p class="note" style="color:#ff0000">'+inner+'</p>';
      }else{
        html+='<p>'+inline(escaped)+'</p>';
      }
    }
  }
  flushList();
  if(inCode)html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';
  return html;
}
/* ===== 文字色ツールバー（編集時・上部固定／共通） ===== */
var COLOR_PRESETS = [
  {name:"赤", v:"#e03131"}, {name:"青", v:"#1971c2"}, {name:"緑", v:"#2f9e44"},
  {name:"オレンジ", v:"#e8590c"}, {name:"紫", v:"#7048e8"}, {name:"ピンク", v:"#d6336c"},
  {name:"茶", v:"#8b5e34"}, {name:"グレー", v:"#868e96"}
];
var _activeTa = null;                       /* 最後にさわった入力欄 */
function registerColorTarget(ta){
  if(!ta) return;
  ta.addEventListener("focus", function(){ _activeTa = ta; });
  ta.addEventListener("click", function(){ _activeTa = ta; });
  ta.addEventListener("keyup", function(){ _activeTa = ta; });
  if(!_activeTa) _activeTa = ta;
}
function applyColorToTextarea(ta, color){
  if(!ta) return;
  var s = ta.selectionStart, e = ta.selectionEnd, val = ta.value;
  if(s === e) return;
  var sel = val.slice(s, e);
  var m = /^\{c:(#[0-9a-fA-F]{3,6}|[a-zA-Z]+)\}([\s\S]*)\{\/c\}$/.exec(sel);
  var wrapped = m ? ("{c:" + color + "}" + m[2] + "{/c}") : ("{c:" + color + "}" + sel + "{/c}");
  ta.value = val.slice(0, s) + wrapped + val.slice(e);
  var np = s + wrapped.length;
  ta.focus(); ta.setSelectionRange(np, np);
  ta.dispatchEvent(new Event("input", {bubbles:true}));
}
function clearColorFromTextarea(ta){
  if(!ta) return;
  var s = ta.selectionStart, e = ta.selectionEnd;
  if(s === e) return;
  var val = ta.value, sel = val.slice(s, e);
  var stripped = sel.replace(/\{c:(?:#[0-9a-fA-F]{3,6}|[a-zA-Z]+)\}([\s\S]*?)\{\/c\}/g, "$1");
  ta.value = val.slice(0, s) + stripped + val.slice(e);
  var np = s + stripped.length;
  ta.focus(); ta.setSelectionRange(np, np);
  ta.dispatchEvent(new Event("input", {bubbles:true}));
}
/* 画面上部に1つだけ出す色バー */
function showColorBar(){
  if(document.getElementById("colorBarFixed")) return;
  var bar = document.createElement("div");
  bar.id = "colorBarFixed";
  bar.className = "colorbar-fixed";
  var lb = document.createElement("span");
  lb.className = "colorbar-lb"; lb.textContent = "文字色";
  bar.appendChild(lb);
  COLOR_PRESETS.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button"; b.className = "color-dot"; b.title = c.name;
    b.style.background = c.v;
    b.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
    b.addEventListener("click", function(){ applyColorToTextarea(_activeTa, c.v); });
    bar.appendChild(b);
  });
  var pick = document.createElement("input");
  pick.type = "color"; pick.className = "color-pick"; pick.value = "#000000"; pick.title = "好きな色";
  pick.addEventListener("input", function(){ applyColorToTextarea(_activeTa, pick.value); });
  bar.appendChild(pick);
  var clr = document.createElement("button");
  clr.type = "button"; clr.className = "color-clear"; clr.textContent = "色を消す";
  clr.addEventListener("mousedown", function(ev){ ev.preventDefault(); });
  clr.addEventListener("click", function(){ clearColorFromTextarea(_activeTa); });
  bar.appendChild(clr);
  document.body.appendChild(bar);
  /* 本文（保存パネル含む）を色バーの下へずらす */
  var sp = document.getElementById("colorBarSpacer");
  if(!sp){
    sp = document.createElement("div");
    sp.id = "colorBarSpacer";
    var hd0 = document.querySelector(".eth-fix, .head-fix");
    if(hd0 && hd0.parentNode) hd0.parentNode.insertBefore(sp, hd0.nextSibling);
    else document.body.insertBefore(sp, document.body.firstChild);
  }
  positionColorBar();
  setTimeout(positionColorBar, 0);
  window.addEventListener("resize", positionColorBar);
}
function positionColorBar(){
  var bar = document.getElementById("colorBarFixed");
  if(!bar) return;
  var hd = document.querySelector(".eth-fix, .head-fix");
  var h = hd ? hd.getBoundingClientRect().height : 0;
  bar.style.top = h + "px";
  var sp = document.getElementById("colorBarSpacer");
  if(sp){
    var bh = bar.getBoundingClientRect().height || bar.offsetHeight || 0;
    sp.style.height = bh + "px";
  }
}
function hideColorBar(){
  var el = document.getElementById("colorBarFixed");
  if(el && el.parentNode) el.parentNode.removeChild(el);
  var sp = document.getElementById("colorBarSpacer");
  if(sp && sp.parentNode) sp.parentNode.removeChild(sp);
  _activeTa = null;
}

function inline(s){
  s=s.replace(/\|\|(.+?)\|\|/g,'<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\{c:(#[0-9a-fA-F]{3,6}|[a-zA-Z]+)\}([\s\S]*?)\{\/c\}/g,function(m,col,txt){
    var ok=/^#[0-9a-fA-F]{3}$|^#[0-9a-fA-F]{6}$|^[a-zA-Z]+$/.test(col);
    return ok?'<span style="color:'+col+'">'+txt+'</span>':m;
  });
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__(.+?)__/g,'<u>$1</u>');
  s=s.replace(/~~(.+?)~~/g,'<s>$1</s>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[^"'>=])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}

function renderRules(){
  const v=document.getElementById('ruleView');
  if(!sections.length){v.innerHTML='<p style="color:var(--text-muted)">まだルールが記入されていません。</p>';return;}
  const escH=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const shown=sections.filter(s=>{
    return s.heading || (s.items||[]).some(it=>(it.name&&it.name.trim())||it.type==='meter'||(it.value&&it.value.trim()));
  });
  if(!shown.length){v.innerHTML='<p style="color:var(--text-muted)">まだルールが記入されていません。</p>';return;}
  v.innerHTML=shown.map(s=>{
    const head=s.heading?'<div class="rule-sec-head">'+escH(s.heading)+'</div>':'';
    let body='';
    (s.items||[]).forEach(it=>{
      const isMeter=it.type==='meter';
      if(!isMeter && !(it.value&&it.value.trim()) && !(it.name&&it.name.trim()))return;
      const nm=(it.name&&it.name.trim())?'<div class="rule-item-name">'+escH(it.name)+'</div>':'';
      let val;
      if(isMeter){
        let segs='';
        for(let lv=1;lv<=LEVELS;lv++)segs+='<button type="button" class="seg'+(Number(it.level)===lv?' on':'')+'"></button>';
        val='<div class="meter-wrap rule-view-meter"><div class="meter-labels"><div>'+escH(it.left)+'</div><div class="right">'+escH(it.right)+'</div></div><div class="meter">'+segs+'</div></div>';
      }else{
        val='<div class="rule-item-text">'+renderMarkdown(it.value||'')+'</div>';
      }
      body+='<div class="rule-item">'+nm+'<div class="rule-item-val">'+val+'</div></div>';
    });
    return '<div class="rule-sec">'+head+'<div class="rule-sec-body">'+body+'</div></div>';
  }).join('');
}

function toggleEdit(){
  editing=!editing;
  document.getElementById('editorWrap').classList.toggle('active',editing);
  document.getElementById('ruleView').style.display=editing?'none':'block';
  document.getElementById('editToggle').textContent=editing?'👁 プレビュー':'✏️ 編集';
  if(editing)renderSectionEditor();
  if(editing) showColorBar(); else hideColorBar();
}

function renderSectionEditor(){
  const _sy=window.pageYOffset||document.documentElement.scrollTop;
  const box=document.getElementById('sectionList');
  box.innerHTML='';
  sections.forEach((s,i)=>box.appendChild(buildSecEdit(s,i)));
  document.querySelectorAll('#sectionList textarea').forEach(function(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';});
  window.scrollTo(0,_sy);
  requestAnimationFrame(function(){window.scrollTo(0,_sy);});
  setTimeout(function(){window.scrollTo(0,_sy);},0);
}
function buildSecEdit(s,i){
  const wrap=document.createElement('div'); wrap.className='sec-edit';
  const head=document.createElement('div'); head.className='sec-edit-head';
  head.innerHTML='<div class="sec-move"><button '+(i===0?'disabled':'')+'>▲</button><button '+(i===sections.length-1?'disabled':'')+'>▼</button></div>'+
    '<input class="form-input" placeholder="見出し（アイコンが自動で付きます）"><button class="sec-del">削除</button>';
  head.querySelector('.form-input').value=s.heading||'';
  head.querySelector('.form-input').addEventListener('input',function(){s.heading=this.value;});
  const mv=head.querySelectorAll('.sec-move button');
  mv[0].addEventListener('click',()=>moveSection(i,-1));
  mv[1].addEventListener('click',()=>moveSection(i,1));
  head.querySelector('.sec-del').addEventListener('click',()=>delSection(i));
  wrap.appendChild(head);

  const itemsBox=document.createElement('div');
  (s.items||[]).forEach((it,j)=>itemsBox.appendChild(buildItemEdit(s,it,i,j)));
  wrap.appendChild(itemsBox);

  const add=document.createElement('button'); add.className='add-item-btn'; add.textContent='＋ 項目を追加';
  add.addEventListener('click',function(){s.items=s.items||[];s.items.push({id:itemUid(),name:'',type:'text',value:'',left:'',right:'',level:0});renderSectionEditor();});
  wrap.appendChild(add);
  return wrap;
}
function buildItemEdit(s,it,si,j){
  const box=document.createElement('div'); box.className='ed-item';
  const top=document.createElement('div'); top.className='ed-item-top';
  const up=document.createElement('button'); up.className='ed-item-mini'; up.textContent='▲';
  const dn=document.createElement('button'); dn.className='ed-item-mini'; dn.textContent='▼';
  up.addEventListener('click',()=>{const k=j-1;if(k<0)return;[s.items[j],s.items[k]]=[s.items[k],s.items[j]];renderSectionEditor();});
  dn.addEventListener('click',()=>{const k=j+1;if(k>=s.items.length)return;[s.items[j],s.items[k]]=[s.items[k],s.items[j]];renderSectionEditor();});
  const nm=document.createElement('input'); nm.className='it-name'; nm.placeholder='項目名'; nm.value=it.name||'';
  nm.addEventListener('input',function(){it.name=this.value;});
  const sel=document.createElement('select');
  [['text','自由入力欄'],['meter','メーター']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];sel.appendChild(op);});
  sel.value=it.type||'text';
  sel.addEventListener('change',function(){it.type=this.value;renderSectionEditor();});
  const del=document.createElement('button'); del.className='ed-item-del'; del.textContent='削除';
  del.addEventListener('click',function(){if(!confirm('この項目を削除しますか？'))return;s.items.splice(j,1);renderSectionEditor();});
  top.appendChild(up); top.appendChild(dn); top.appendChild(nm); top.appendChild(sel);

  let lf,rg;
  if((it.type||'text')==='meter'){
    lf=document.createElement('input'); lf.className='it-lb'; lf.placeholder='左のラベル'; lf.value=it.left||'';
    rg=document.createElement('input'); rg.className='it-lb'; rg.placeholder='右のラベル'; rg.value=it.right||'';
    lf.addEventListener('input',function(){it.left=this.value;lv.textContent=this.value;});
    rg.addEventListener('input',function(){it.right=this.value;rv.textContent=this.value;});
    top.appendChild(lf); top.appendChild(rg);
  }
  top.appendChild(del);
  box.appendChild(top);

  const val=document.createElement('div'); val.className='rule-item-val';
  var lv,rv;
  if((it.type||'text')==='meter'){
    const mw=document.createElement('div'); mw.className='meter-wrap';
    const labels=document.createElement('div'); labels.className='meter-labels';
    lv=document.createElement('div'); lv.textContent=it.left||'';
    rv=document.createElement('div'); rv.className='right'; rv.textContent=it.right||'';
    labels.appendChild(lv); labels.appendChild(rv);
    const meter=document.createElement('div'); meter.className='meter';
    for(let k=1;k<=LEVELS;k++){
      const seg=document.createElement('button'); seg.type='button'; seg.className='seg'+(Number(it.level)===k?' on':''); seg.dataset.level=String(k);
      seg.addEventListener('click',function(){const nv=(Number(it.level)===k)?0:k;it.level=nv;meter.querySelectorAll('.seg').forEach(sg=>sg.classList.toggle('on',Number(sg.dataset.level)===nv));});
      meter.appendChild(seg);
    }
    mw.appendChild(labels); mw.appendChild(meter); val.appendChild(mw);
  }else{
    const ta=document.createElement('textarea'); ta.className='sec-body'; ta.placeholder='自由入力（Discord記法対応）'; ta.value=it.value||'';
    ta.addEventListener('input',function(){it.value=this.value;autoGrow(ta);});
    ta.addEventListener('keydown',function(e){if(e.key!=='Tab')return;e.preventDefault();const st=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,st)+'\u3000'+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=st+1;it.value=ta.value;autoGrow(ta);});
    registerColorTarget(ta);
    val.appendChild(ta);
  }
  box.appendChild(val);
  return box;
}
function autoGrow(ta){const sy=window.pageYOffset||document.documentElement.scrollTop;ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';window.scrollTo(0,sy);}
function handleTab(e,i){
  if(e.key!=='Tab')return;
  e.preventDefault();
  const ta=e.target;
  const start=ta.selectionStart, end=ta.selectionEnd;
  const indent='\u3000'; // 全角スペース1つ
  ta.value=ta.value.slice(0,start)+indent+ta.value.slice(end);
  ta.selectionStart=ta.selectionEnd=start+indent.length;
  sections[i].body=ta.value;
  autoGrow(ta);
}
function addSection(){sections.push({heading:'',items:[]});renderSectionEditor();}
function delSection(i){if(!confirm('この見出しを削除しますか？'))return;sections.splice(i,1);renderSectionEditor();}
function moveSection(i,dir){const j=i+dir;if(j<0||j>=sections.length)return;[sections[i],sections[j]]=[sections[j],sections[i]];renderSectionEditor();}
function cancelEdit(){editing=true;toggleEdit();}

async function saveRules(){
  const t=getGHToken();
  if(!t){setStatus('GitHubトークン（repo権限）を入力してください。',true);return;}
  saveGHToken(t);
  setStatus('GitHubへ保存中…',false);
  showLoading(true);
  try{await apiSave({sections});await loadRules();setStatus('GitHubへ保存しました。',false);}
  catch(e){setStatus('保存に失敗しました：'+e.message,true);}
  showLoading(false);
}

function openTokenModal(){document.getElementById('tokenInput').value=getGHToken();document.getElementById('tokenOverlay').classList.add('open');}
function saveToken(){const t=document.getElementById('tokenInput').value.trim();if(!t){alert('トークンを入力してください');return;}saveGHToken(t);document.getElementById('tokenOverlay').classList.remove('open');loadRules();}

function copyViewUrl(){
  const url=location.origin+location.pathname;
  navigator.clipboard.writeText(url).then(()=>alert('閲覧用URLをコピーしました:\n'+url)).catch(()=>prompt('閲覧用URL',url));
}
if(IS_EDIT_MODE){
  document.getElementById('editBtns').style.display='flex';
  document.body.classList.add('editmode');
  var _tk=localStorage.getItem(GH_TOKEN_KEY)||'';
  var _tel=document.getElementById('token'); if(_tel&&_tk)_tel.value=_tk;
}
loadRules();
</script>

<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/EiThiophile";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  var CACHE_KEY = "eth_profile_cache_v1";
  function readCache(){
    try{ var s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }
  }
  function writeCache(j){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(j)); }catch(e){}
  }
  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && Array.isArray(j.majors)) writeCache(j);
      else j = readCache();               /* 取得失敗時は前回の内容を使う */
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      var _vis = (cur ? (cur.pages || []) : []).filter(function(p){ return !p.hidden; });
      if(cur && _vis.length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          if(p.hidden) return;
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){
      /* 通信自体が失敗 → 前回内容で描画 */
      var j = readCache();
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      if(!majors.length) return;
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });
      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        b.className = "eth-mtab" + ((cur && m.id === cur.id) ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });
    });
})();
</script>
