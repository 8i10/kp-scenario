<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地雷・苦手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* base = light */
  --bg:#f5f5f5; --bg2:#ffffff; --bg3:#ececec; --panel:#ffffff;
  --line:#d4d4d4; --line2:#c2c2c2;
  --ink:#222222; --muted:#777777; --faint:#999999;
  --accent:#8b0000; --accent-h:#a31414;
  --shadow:0 6px 24px rgba(0,0,0,.12);
  --mincho:"Shippori Mincho",serif;
  --gothic:"Zen Kaku Gothic New",sans-serif;
  --mono:"JetBrains Mono",monospace;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#1a1a1a; --bg2:#242424; --bg3:#2e2e2e; --panel:#242424;
  --line:#3a3a3a; --line2:#4a4a4a;
  --ink:#eaeaea; --muted:#9a9a9a; --faint:#767676;
  --accent:#a31414; --accent-h:#c22323;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--gothic); line-height:1.75;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  transition:background .25s,color .25s;
}
a{color:var(--accent-h)}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 80px}

/* header */
header.site{
  position:relative;
  padding:38px 18px 22px;
  text-align:center;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg3),var(--bg));
}
header.site .kana{
  font-family:var(--mono); font-size:11px; letter-spacing:.4em;
  color:var(--accent); text-transform:uppercase; margin-bottom:10px;
}
header.site h1{
  font-family:var(--mincho); font-weight:700;
  font-size:clamp(26px,6vw,40px); letter-spacing:.14em;
  margin:0; line-height:1.3;
}
header.site h1 .editable-title{outline:none}
header.site .updated{
  font-family:var(--mono); font-size:11px; color:var(--faint);
  margin-top:12px; letter-spacing:.08em;
}
header.site h1::after{
  content:""; display:block; width:46px; height:2px;
  background:var(--accent); margin:14px auto 0; opacity:.8;
}

/* top toolbar */
.toolbar{
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
  padding:14px 18px 4px; max-width:820px; margin:0 auto;
}
.btn{
  font-family:var(--gothic); font-size:13px; font-weight:500;
  color:var(--ink); background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; padding:7px 13px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--line2);background:var(--bg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent}
.btn.sm{font-size:12px;padding:4px 9px;border-radius:6px}
.btn.danger{color:var(--accent-h);border-color:transparent;background:transparent}
.btn.danger:hover{background:rgba(139,0,0,.10)}

/* intro note */
.intro{
  margin:26px 0 6px; padding:18px 20px;
  background:var(--panel); border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:10px; font-size:14px; color:var(--ink);
  white-space:pre-wrap; word-break:break-word;
}
.intro.empty{color:var(--faint);font-style:normal}
.intro[contenteditable="true"]{outline:1px dashed var(--line2);cursor:text}

/* history preview (latest 3 of 追加履歴) */
.history-preview{
  margin:14px 0 4px; padding:12px 16px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
}
.hist-label{
  font-size:11px; font-weight:700; letter-spacing:.08em;
  color:var(--tabc,var(--accent)); margin-bottom:8px;
}
.hist-item{padding:6px 0 6px 13px;position:relative;border-bottom:1px dashed var(--line)}
.hist-item:last-child{border-bottom:none}
.hist-item::before{
  content:""; position:absolute; left:0; top:12px;
  width:5px; height:5px; border-radius:50%; background:var(--tabc,var(--accent));
}
.hist-title{font-family:var(--mincho);font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.55}
.hist-body{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}

/* tabs */
.tabs{
  display:flex; gap:6px; flex-wrap:wrap; margin:28px 0 4px;
  border-bottom:1px solid var(--line); padding-bottom:0;
}
.tab{
  font-family:var(--gothic); font-size:14px; font-weight:500;
  color:var(--muted); background:transparent; border:none;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 12px 10px; cursor:pointer; transition:.15s;
  display:inline-flex; align-items:center; gap:7px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--tabc,var(--accent))}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--tabc,var(--accent));flex:0 0 auto}
.tab.add{color:var(--faint);font-size:13px}

/* tab admin row */
.tabadmin{
  display:none; align-items:center; gap:10px; flex-wrap:wrap;
  margin:12px 0 0; padding:12px 14px;
  background:var(--bg2); border:1px solid var(--line); border-radius:9px;
}
.editing .tabadmin{display:flex}
.tabadmin input.rn{
  font-family:var(--gothic); font-size:14px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:6px 9px; width:180px;
}
.swatches{display:flex;gap:5px}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.tabadmin .lbl{font-size:12px;color:var(--muted)}

/* entries */
.entries{margin-top:6px}
.entry{
  padding:20px 4px 18px; border-bottom:1px solid var(--line);
  position:relative;
}
.entry:last-child{border-bottom:none}
.entry h3{
  font-family:var(--mincho); font-weight:600;
  font-size:18px; letter-spacing:.03em; margin:0;
  padding:2px 40px 2px 22px; position:relative; line-height:1.5;
  cursor:pointer; user-select:none;
}
.entry h3 .chev{
  position:absolute; left:2px; top:.5em;
  color:var(--tabc,var(--accent)); font-size:.72em; line-height:1;
  transition:transform .18s ease;
}
.entry.open h3 .chev{transform:rotate(90deg)}
.entry .body{
  font-size:14px; color:var(--ink); white-space:pre-wrap; word-break:break-word;
  display:none; margin-top:10px; padding-left:22px;
}
.entry.open>.body{display:block}
.entry .body strong{color:var(--accent-h);font-weight:700}

/* ---- Discord markdown ---- */
.dc-h1{font-family:var(--mincho);font-size:1.4em;font-weight:700;line-height:1.4;margin:.5em 0 .2em}
.dc-h2{font-family:var(--mincho);font-size:1.2em;font-weight:700;line-height:1.4;margin:.5em 0 .2em}
.dc-h3{font-family:var(--mincho);font-size:1.05em;font-weight:600;line-height:1.4;margin:.4em 0 .2em}
.dc-sub{font-size:.82em;color:var(--muted);line-height:1.5;margin:.1em 0}
.dc-gap{height:.7em}
.dc-quote{
  border-left:3px solid var(--line2); margin:.35em 0; padding:2px 0 2px 12px;
  color:var(--ink);
}
.dc-list{margin:.3em 0;padding-left:1.5em}
.dc-list li{margin:.1em 0}
.dc-code{
  font-family:var(--mono); font-size:.86em;
  background:var(--bg3); border:1px solid var(--line); border-radius:4px;
  padding:1px 5px;
}
.dc-pre{
  font-family:var(--mono); font-size:.84em; line-height:1.5;
  background:var(--bg3); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; margin:.4em 0; overflow-x:auto; white-space:pre;
}
.dc-pre code{background:none;border:none;padding:0;font-size:1em}
.dc-spoiler{
  background:var(--faint); color:transparent; border-radius:4px;
  padding:0 3px; cursor:pointer; transition:color .1s; user-select:none;
}
.dc-spoiler:hover{background:var(--line2)}
.dc-spoiler.on{background:var(--bg3);color:var(--ink);cursor:auto;user-select:auto}
.body u,.intro u{text-decoration:underline}
.body del,.intro del{opacity:.7}
.entry.dragging{opacity:.4}
.entry.dragover{box-shadow:inset 0 2px 0 var(--accent)}

/* entry edit controls */
.entry .ctl{
  display:none; gap:6px; position:absolute; right:2px; top:16px;
}
.editing .entry .ctl{display:flex}
.editing .entry{cursor:grab;border-radius:8px}
.editing .entry:hover{background:var(--bg2)}
.grip{
  display:none; position:absolute; left:-14px; top:22px;
  color:var(--faint); font-size:14px; cursor:grab; user-select:none;
}
.editing .grip{display:block}

/* entry form */
.eform{display:flex;flex-direction:column;gap:9px;padding:4px 0}
.eform input,.eform textarea{
  font-family:var(--gothic); color:var(--ink);
  background:var(--bg); border:1px solid var(--line2); border-radius:7px;
  padding:9px 11px; font-size:14px; width:100%; resize:vertical;
}
.eform input{font-family:var(--mincho);font-size:16px;font-weight:600}
.eform textarea{min-height:96px;line-height:1.7}
.eform .row{display:flex;gap:8px;justify-content:flex-end}
.hint{font-size:11px;color:var(--faint)}

.emptystate{padding:34px 10px;text-align:center;color:var(--faint);font-size:13px}

.addentry{display:none;margin:16px 0 0}
.editing .addentry{display:block}

/* modal */
.mask{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
  z-index:50; align-items:center; justify-content:center; padding:18px;
}
.mask.on{display:flex}
.modal{
  background:var(--bg2); border:1px solid var(--line2); border-radius:14px;
  box-shadow:var(--shadow); width:100%; max-width:460px; padding:24px;
}
.modal h2{font-family:var(--mincho);font-size:19px;margin:0 0 4px;letter-spacing:.05em}
.modal p{font-size:13px;color:var(--muted);margin:6px 0 14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.modal input{
  width:100%; font-family:var(--mono); font-size:13px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 11px;
}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.urlbox{
  display:flex;gap:6px;margin-top:8px;
}
.urlbox input{font-size:12px}
.note-s{font-size:11px;color:var(--faint);margin-top:10px;line-height:1.6}
.note-s code{font-family:var(--mono);color:var(--accent-h);background:var(--bg3);padding:1px 5px;border-radius:4px}

/* toast */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:500;
  padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
  transition:.25s; z-index:60;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{text-align:center;color:var(--faint);font-size:11px;font-family:var(--mono);margin-top:40px;letter-spacing:.06em}

@media(max-width:560px){
  .entry .ctl{position:static;display:none;margin-top:10px}
  .editing .entry .ctl{display:flex}
  .grip{display:none!important}
  .editing .entry{cursor:default}
  .tabadmin input.rn{width:100%}
}

</style>

<style>
/* ===== 共通ヘッダー（EITHIOPHILE） ===== */
.eth-fix{position:sticky;top:0;z-index:1200}
header.eth{background:#8b0000}
.eth-inner{max-width:860px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.eth-title{font-size:17px;font-weight:800;color:#ffffff;letter-spacing:.30em;font-family:Arial,Helvetica,sans-serif}
.eth-navwrap{position:relative}
.eth-navbtn{background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:4px 11px;font-size:16px;line-height:1.2;cursor:pointer;color:#fff;font-family:inherit}
.eth-navbtn:hover{background:rgba(255,255,255,.15)}
.eth-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:1300;background:#ffffff;border:1px solid #d4d4d4;border-radius:8px;min-width:200px;max-height:70vh;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px}
.eth-menu.open{display:block}
.eth-mtab{display:block;width:100%;text-align:left;background:transparent;border:none;color:#222;padding:9px 12px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit;border-radius:6px}
.eth-mtab:hover{background:#ececec}
.eth-mtab.active{background:#8b0000;color:#fff;font-weight:700}
.eth-tabbar{background:#ffffff;border-bottom:1px solid #d4d4d4;overflow-x:auto;-webkit-overflow-scrolling:touch}
.eth-tabbar-inner{max-width:860px;margin:0 auto;display:flex}
.eth-tab{background:transparent;border:none;border-bottom:2px solid transparent;color:#777;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.eth-tab:hover{color:#222}
.eth-tab.active{color:#222;font-weight:700;border-bottom-color:#8b0000}
</style>
</head>
<body>

<div class="eth-fix">
  <header class="eth">
    <div class="eth-inner">
      <div class="eth-title">EITHIOPHILE</div>
      <div class="eth-navwrap">
        <button class="eth-navbtn" id="ethNavBtn" aria-label="メニュー">≡</button>
        <div class="eth-menu" id="ethNavMenu"></div>
      </div>
    </div>
  </header>
  <nav class="eth-tabbar" id="ethTabbar" style="display:none"><div class="eth-tabbar-inner" id="ethTabbarInner"></div></nav>
</div>


<div class="toolbar" id="toolbar"></div>

<header class="site">
  <div class="kana">landmine &amp; dislike</div>
  <h1><span class="editable-title" id="titleEl">地雷・苦手</span></h1>
  <div class="updated" id="updatedEl"></div>
</header>

<div class="wrap">
  <div class="intro" id="introEl"></div>

  <div class="history-preview" id="historyEl"></div>

  <div class="tabs" id="tabsEl"></div>
  <div class="tabadmin" id="tabAdmin"></div>

  <div class="entries" id="entriesEl"></div>
  <div class="addentry"><button class="btn ghost" id="addEntryBtn">＋ 項目を追加</button></div>

  <footer>© EiThiophile</footer>
</div>

<!-- token modal -->
<div class="mask" id="tokenMask">
  <div class="modal">
    <h2>同期設定</h2>
    <p>公開・更新にはGitHubトークンが必要です。この端末にのみ保存されます。</p>
    <label>GitHub Token</label>
    <input id="tokenInput" type="password" placeholder="ghp_xxxxxxxx" autocomplete="off">
    <div class="note-s">
      Settings → Developer settings → Personal access tokens → Tokens (classic) から発行。<code>gist</code> スコープのみでOK。
    </div>
    <div class="foot">
      <button class="btn ghost" data-close>キャンセル</button>
      <button class="btn primary" id="tokenSave">保存</button>
    </div>
  </div>
</div>

<!-- publish result modal -->
<div class="mask" id="urlMask">
  <div class="modal">
    <h2>閲覧URL</h2>
    <p>このURLを共有すると、閲覧専用ページとして開けます。</p>
    <div class="urlbox">
      <input id="viewUrl" readonly>
      <button class="btn primary" id="copyUrl">コピー</button>
    </div>
    <div class="note-s">更新するときは同じ「公開・更新」ボタンから。URLは変わりません。</div>
    <div class="foot"><button class="btn ghost" data-close>閉じる</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const GIST_FILE = "jirai.json";
const LS_DATA = "jirai_data_v1";
const LS_PAT  = "jirai_pat";
const LS_GIST = "jirai_gist_id";
const LS_THEME= "jirai_theme";
const PALETTE = ["#8b0000","#666666","#333333","#a31414","#999999","#c25e8a"];

let state = null;      // {title,intro,updated,tabs:[{id,name,color,entries:[{id,title,body}]}]}
let active = 0;        // active tab index
let readOnly = false;  // ?view= mode
let editing = false;
let gistId = null;
let editingEntry = null; // entry id currently in form (or "__new__")

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);

function defaultState(){
  return {
    title:"地雷・苦手",
    intro:"※ここに前置きや注意書きを記入できます（右上の「編集」から）。\n\n引っかかるものがあれば、一旦ご相談ください。全てに配慮を求めるものではありません。",
    updated:"",
    tabs:[
      {id:uid(),name:"対人関連",color:PALETTE[4],entries:[
        {id:uid(),title:"（例）これは項目の見本です",body:"「編集」を押すと項目の追加・編集・並べ替え・削除ができます。\n本文では **太字** と改行がそのまま反映されます。"}
      ]},
      {id:uid(),name:"TRPG-地雷",color:PALETTE[0],entries:[]},
      {id:uid(),name:"TRPG-苦手",color:PALETTE[1],entries:[]},
      {id:uid(),name:"TRPG-その他",color:PALETTE[2],entries:[]},
      {id:uid(),name:"追加履歴",color:PALETTE[3],entries:[]}
    ]
  };
}

/* ---------- Discord markdown ---------- */
function fmt(raw){
  if(!raw) return "";
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const store=[];
  const tok = html => { store.push(html); return "\u0000"+(store.length-1)+"\u0000"; };

  let src = raw.replace(/\r\n/g,"\n");

  // fenced code block ```lang\n...``` (protect from all other formatting)
  src = src.replace(/```(?:[a-zA-Z0-9+#.\-]*\n)?([\s\S]*?)```/g,(m,code)=>
    tok('<pre class="dc-pre"><code>'+esc(code.replace(/\n$/,""))+'</code></pre>'));
  // inline code `...`
  src = src.replace(/`([^`\n]+?)`/g,(m,code)=>tok('<code class="dc-code">'+esc(code)+'</code>'));

  // escape everything else (tokens contain no special chars, so survive)
  src = esc(src);

  // inline-level transforms (operate on already-escaped text)
  function inlineMd(s){
    // spoiler ||text||  (click to reveal)
    s = s.replace(/\|\|([^\n]+?)\|\|/g,'<span class="dc-spoiler" onclick="this.classList.add(\'on\')">$1</span>');
    // masked link [text](url) -> tokenized so url isn't reformatted
    s = s.replace(/\[([^\]\n]+?)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>tok('<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>'));
    // bold italic ***text***
    s = s.replace(/\*\*\*([^\n]+?)\*\*\*/g,"<strong><em>$1</em></strong>");
    // bold **text**
    s = s.replace(/\*\*([^\n]+?)\*\*/g,"<strong>$1</strong>");
    // underline __text__
    s = s.replace(/__([^\n]+?)__/g,"<u>$1</u>");
    // strikethrough ~~text~~
    s = s.replace(/~~([^\n]+?)~~/g,"<del>$1</del>");
    // italic *text*
    s = s.replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>");
    // italic _text_
    s = s.replace(/(^|[^_\w])_(?!\s)([^_\n]+?)_(?![_\w])/g,"$1<em>$2</em>");
    return s;
  }

  const lines = src.split("\n");
  const out=[];
  let para=[], list=null;
  const flushPara=()=>{ if(para.length){ out.push(para.map(inlineMd).join("<br>")); para=[]; } };
  const flushList=()=>{ if(list){ out.push("<"+list.type+' class="dc-list">'+list.items.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+"</"+list.type+">"); list=null; } };
  const flush=()=>{ flushPara(); flushList(); };

  for(let i=0;i<lines.length;i++){
    const ln=lines[i]; let m;
    // multi-line blockquote  >>> (rest of text)
    if(/^&gt;&gt;&gt;\s?/.test(ln)){
      flush();
      const rest=[ln.replace(/^&gt;&gt;&gt;\s?/,"")].concat(lines.slice(i+1)).join("\n");
      out.push('<blockquote class="dc-quote">'+rest.split("\n").map(inlineMd).join("<br>")+"</blockquote>");
      break;
    }
    // single-line blockquote  >  (merge consecutive)
    if(/^&gt;\s?/.test(ln)){
      flush();
      const q=[ln.replace(/^&gt;\s?/,"")];
      while(i+1<lines.length && /^&gt;\s?/.test(lines[i+1]) && !/^&gt;&gt;&gt;/.test(lines[i+1])){ i++; q.push(lines[i].replace(/^&gt;\s?/,"")); }
      out.push('<blockquote class="dc-quote">'+q.map(inlineMd).join("<br>")+"</blockquote>");
      continue;
    }
    // headers  # / ## / ###   and subtext  -#
    if(m=ln.match(/^###\s+(.*)$/)){ flush(); out.push('<div class="dc-h3">'+inlineMd(m[1])+"</div>"); continue; }
    if(m=ln.match(/^##\s+(.*)$/)) { flush(); out.push('<div class="dc-h2">'+inlineMd(m[1])+"</div>"); continue; }
    if(m=ln.match(/^#\s+(.*)$/))  { flush(); out.push('<div class="dc-h1">'+inlineMd(m[1])+"</div>"); continue; }
    if(m=ln.match(/^-#\s+(.*)$/)) { flush(); out.push('<div class="dc-sub">'+inlineMd(m[1])+"</div>"); continue; }
    // ordered list  1.
    if(m=ln.match(/^\s*\d+\.\s+(.*)$/)){ flushPara(); if(!list||list.type!=="ol"){ flushList(); list={type:"ol",items:[]}; } list.items.push(m[1]); continue; }
    // unordered list  - / *
    if(m=ln.match(/^\s*[-*]\s+(.*)$/)){ flushPara(); if(!list||list.type!=="ul"){ flushList(); list={type:"ul",items:[]}; } list.items.push(m[1]); continue; }
    // blank line
    if(ln.trim()===""){ flush(); out.push('<div class="dc-gap"></div>'); continue; }
    // normal text line
    flushList(); para.push(ln);
  }
  flush();

  let html = out.join("");
  html = html.replace(/\u0000(\d+)\u0000/g,(m,i)=>store[+i]); // restore code / links
  return html;
}
function today(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate());
}

/* ---------- persistence ---------- */
function saveLocal(){
  if(readOnly) return;
  try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){}
}

/* ---------- gist ---------- */
async function fetchGist(id){
  const r = await fetch("https://api.github.com/gists/"+id,{headers:{Accept:"application/vnd.github+json"}});
  if(!r.ok) throw new Error("読み込みに失敗しました ("+r.status+")");
  const j = await r.json();
  const f = j.files && j.files[GIST_FILE];
  if(!f) throw new Error("データが見つかりませんでした");
  return JSON.parse(f.content);
}
async function publish(){
  const pat = localStorage.getItem(LS_PAT);
  if(!pat){ openTokenModal(); return; }
  state.updated = today();
  const body = {
    description:"地雷・苦手",
    public:false,
    files:{ [GIST_FILE]:{ content: JSON.stringify(state,null,2) } }
  };
  const url = gistId ? "https://api.github.com/gists/"+gistId : "https://api.github.com/gists";
  const method = gistId ? "PATCH" : "POST";
  toast("公開中…");
  const r = await fetch(url,{
    method,
    headers:{Authorization:"token "+pat, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(r.status===401){ toast("トークンが無効です"); openTokenModal(); return; }
  if(!r.ok){ toast("公開に失敗しました ("+r.status+")"); return; }
  const j = await r.json();
  gistId = j.id;
  localStorage.setItem(LS_GIST, gistId);
  saveLocal(); render();
  showUrl();
}
function viewUrlFor(id){
  return location.origin + location.pathname + "?view=" + id;
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("editing", editing && !readOnly);

  // title / updated
  const titleEl = $("#titleEl");
  titleEl.textContent = state.title || "地雷・苦手";
  titleEl.contentEditable = editing && !readOnly ? "true" : "false";
  $("#updatedEl").textContent = state.updated ? "最終更新 "+state.updated : "";

  // intro
  const intro = $("#introEl");
  intro.contentEditable = editing && !readOnly ? "true" : "false";
  if(editing && !readOnly){
    intro.classList.remove("empty");
    intro.textContent = state.intro || "";
  }else{
    if(state.intro && state.intro.trim()){
      intro.classList.remove("empty");
      intro.innerHTML = fmt(state.intro);
    }else{
      intro.classList.add("empty");
      intro.textContent = "";
    }
  }
  intro.style.display = (!editing && (!state.intro || !state.intro.trim())) ? "none" : "";

  renderHistory();

  // tabs
  if(active>=state.tabs.length) active=Math.max(0,state.tabs.length-1);
  const tabs = $("#tabsEl"); tabs.innerHTML="";
  state.tabs.forEach((t,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===active?" active":"");
    b.style.setProperty("--tabc",t.color||PALETTE[0]);
    b.innerHTML='<span class="dot"></span>'+escapeHtml(t.name);
    b.onclick=()=>{ active=i; editingEntry=null; render(); };
    tabs.appendChild(b);
  });
  if(editing && !readOnly){
    const add=document.createElement("button");
    add.className="tab add"; add.textContent="＋ タブ";
    add.onclick=addTab;
    tabs.appendChild(add);
  }

  renderTabAdmin();
  renderEntries();
}

function escapeHtml(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderTabAdmin(){
  const box=$("#tabAdmin"); box.innerHTML="";
  if(!(editing && !readOnly) || !state.tabs.length) return;
  const t=state.tabs[active];
  const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent="タブ名";
  const rn=document.createElement("input"); rn.className="rn"; rn.value=t.name;
  rn.oninput=()=>{ t.name=rn.value; saveLocal();
    const tb=$("#tabsEl").children[active]; if(tb) tb.lastChild.textContent=rn.value; };
  const sw=document.createElement("div"); sw.className="swatches";
  PALETTE.forEach(c=>{
    const s=document.createElement("span");
    s.className="sw"+(t.color===c?" on":""); s.style.background=c;
    s.onclick=()=>{ t.color=c; saveLocal(); render(); };
    sw.appendChild(s);
  });
  const del=document.createElement("button"); del.className="btn danger sm"; del.textContent="タブを削除";
  del.onclick=()=>{
    if(state.tabs.length<=1){ toast("最後のタブは削除できません"); return; }
    if(!confirm("「"+t.name+"」を削除しますか？")) return;
    state.tabs.splice(active,1); active=Math.max(0,active-1); saveLocal(); render();
  };
  box.appendChild(lbl); box.appendChild(rn); box.appendChild(sw); box.appendChild(del);
}

function renderHistory(){
  const el=$("#historyEl");
  el.style.removeProperty("--tabc");
  // newest = most recently added = end of each list -> reverse for newest-first
  const src=["TRPG-地雷","TRPG-苦手"].map(nm=>{
    const tab=state.tabs.find(t=>t.name===nm);
    return tab ? tab.entries.slice().reverse() : [];
  });
  const items=[];
  for(let i=0; items.length<3 && (i<src[0].length || i<src[1].length); i++){
    if(src[0][i] && items.length<3) items.push(src[0][i]);
    if(src[1][i] && items.length<3) items.push(src[1][i]);
  }
  if(!items.length){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="";
  el.innerHTML='<div class="hist-label">追加履歴</div>'+
    items.map(e=>'<div class="hist-item">'+
      '<div class="hist-title">'+escapeHtml(e.title||"（無題）")+'</div>'+
      (e.body? '<div class="hist-body">'+fmt(e.body)+'</div>':'')+
    '</div>').join("");
}

function renderEntries(){
  const wrap=$("#entriesEl"); wrap.innerHTML="";
  const tab=state.tabs[active];
  if(!tab){ return; }
  const canEdit = editing && !readOnly;

  if(!tab.entries.length && !canEdit){
    wrap.innerHTML='<div class="emptystate">記載なし</div>';
    return;
  }
  if(!tab.entries.length && canEdit){
    wrap.innerHTML='<div class="emptystate">まだ項目がありません。「＋ 項目を追加」から追加してください。</div>';
    return;
  }

  tab.entries.forEach((e,idx)=>{
    if(canEdit && editingEntry===e.id){ wrap.appendChild(entryForm(e,idx)); return; }
    const el=document.createElement("div");
    el.className="entry"; el.style.setProperty("--tabc",tab.color||PALETTE[0]);
    el.innerHTML='<span class="grip">⠿</span>'+
      '<h3><span class="chev">▶</span>'+escapeHtml(e.title||"（無題）")+'</h3>'+
      '<div class="body">'+(e.body?fmt(e.body):'<span style="color:var(--faint)">（本文なし）</span>')+'</div>';
    el.querySelector("h3").onclick=()=>{ el.classList.toggle("open"); };
    if(canEdit){
      const ctl=document.createElement("div"); ctl.className="ctl";
      const ed=document.createElement("button"); ed.className="btn sm"; ed.textContent="編集";
      ed.onclick=()=>{ editingEntry=e.id; render(); };
      const rm=document.createElement("button"); rm.className="btn danger sm"; rm.textContent="削除";
      rm.onclick=()=>{ if(confirm("この項目を削除しますか？")){ tab.entries.splice(idx,1); saveLocal(); render(); } };
      ctl.appendChild(ed); ctl.appendChild(rm); el.appendChild(ctl);
      enableDrag(el,idx,tab);
    }
    wrap.appendChild(el);
  });
}

function entryForm(e,idx){
  const box=document.createElement("div"); box.className="entry";
  box.innerHTML=
    '<div class="eform">'+
      '<input class="et" placeholder="見出し（例：無断遅刻について）">'+
      '<textarea class="eb" placeholder="本文（Discord記法対応）"></textarea>'+
      '<div class="hint">Discord記法対応：**太字** *斜体* __下線__ ~~取消~~ `コード` ||伏字|| ＞引用 #見出し -リスト [表示文](URL) ```コードブロック```</div>'+
      '<div class="row">'+
        '<button class="btn ghost cancel">キャンセル</button>'+
        '<button class="btn primary ok">保存</button>'+
      '</div>'+
    '</div>';
  const et=box.querySelector(".et"), eb=box.querySelector(".eb");
  et.value=e.title||""; eb.value=e.body||"";
  box.querySelector(".ok").onclick=()=>{
    e.title=et.value.trim(); e.body=eb.value;
    if(e.__new){ delete e.__new; }
    editingEntry=null; saveLocal(); render();
  };
  box.querySelector(".cancel").onclick=()=>{
    if(e.__new){ state.tabs[active].entries.splice(idx,1); }
    editingEntry=null; saveLocal(); render();
  };
  setTimeout(()=>et.focus(),0);
  return box;
}

/* ---------- drag reorder ---------- */
let dragIdx=null;
function enableDrag(el,idx,tab){
  el.draggable=true;
  el.addEventListener("dragstart",ev=>{ dragIdx=idx; el.classList.add("dragging"); ev.dataTransfer.effectAllowed="move"; });
  el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); dragIdx=null;
    document.querySelectorAll(".entry.dragover").forEach(n=>n.classList.remove("dragover")); });
  el.addEventListener("dragover",ev=>{ ev.preventDefault(); el.classList.add("dragover"); });
  el.addEventListener("dragleave",()=>el.classList.remove("dragover"));
  el.addEventListener("drop",ev=>{
    ev.preventDefault(); el.classList.remove("dragover");
    if(dragIdx===null||dragIdx===idx) return;
    const arr=tab.entries; const [m]=arr.splice(dragIdx,1); arr.splice(idx,0,m);
    saveLocal(); render();
  });
}

/* ---------- actions ---------- */
function addTab(){
  const t={id:uid(),name:"新しいタブ",color:PALETTE[state.tabs.length%PALETTE.length],entries:[]};
  state.tabs.push(t); active=state.tabs.length-1; saveLocal(); render();
}
function addEntry(){
  const e={id:uid(),title:"",body:"",__new:true};
  state.tabs[active].entries.push(e);
  editingEntry=e.id; render();
}

/* ---------- toolbar ---------- */
function buildToolbar(){
  const tb=$("#toolbar"); tb.innerHTML="";
  const mk=(label,cls,fn)=>{const b=document.createElement("button");b.className="btn "+cls;b.innerHTML=label;b.onclick=fn;return b;};

  if(!readOnly){
    const editBtn=mk(editing?"完了":"✏️ 編集", editing?"primary":"", toggleEdit);
    tb.appendChild(editBtn);
    if(editing){
      tb.appendChild(mk("☁ 公開・更新","", ()=>publish().catch(e=>toast(e.message))));
      tb.appendChild(mk("🔗 URL","ghost", ()=>{ if(gistId) showUrl(); else toast("先に「公開・更新」してください"); }));
      tb.appendChild(mk("⚙ 同期設定","ghost", openTokenModal));
    }
  }else{
    const badge=document.createElement("span");
    badge.className="btn ghost"; badge.style.pointerEvents="none"; badge.textContent="👁 閲覧専用";
    tb.appendChild(badge);
  }
  tb.appendChild(mk(theme()==="light"?"🌙 ダーク":"☀ ライト","ghost", toggleTheme));
}
function toggleEdit(){
  if(readOnly) return;
  editing=!editing; editingEntry=null;
  if(!editing){ // leaving edit: capture contenteditable
    state.title = $("#titleEl").textContent.trim() || "地雷・苦手";
    state.intro = $("#introEl").textContent;
    saveLocal();
  }
  buildToolbar(); render();
}

/* ---------- theme ---------- */
function theme(){ return document.documentElement.getAttribute("data-theme")||"light"; }
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); }
function toggleTheme(){ const t=theme()==="light"?"dark":"light"; applyTheme(t); localStorage.setItem(LS_THEME,t); buildToolbar(); }

/* ---------- modals ---------- */
function openTokenModal(){ $("#tokenInput").value=localStorage.getItem(LS_PAT)||""; $("#tokenMask").classList.add("on"); }
function showUrl(){ const u=viewUrlFor(gistId); $("#viewUrl").value=u; $("#urlMask").classList.add("on"); }

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }

/* ---------- capture contenteditable live ---------- */
function wireEditable(){
  $("#titleEl").addEventListener("blur",()=>{ if(editing&&!readOnly){ state.title=$("#titleEl").textContent.trim()||"地雷・苦手"; saveLocal(); } });
  $("#introEl").addEventListener("blur",()=>{ if(editing&&!readOnly){ state.intro=$("#introEl").textContent; saveLocal(); } });
  $("#titleEl").addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault();$("#titleEl").blur();} });
}

/* ---------- init ---------- */
async function init(){
  applyTheme(localStorage.getItem(LS_THEME)||"light");

  // modal close handlers
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{ $("#tokenMask").classList.remove("on"); $("#urlMask").classList.remove("on"); });
  document.querySelectorAll(".mask").forEach(m=>m.addEventListener("click",ev=>{ if(ev.target===m) m.classList.remove("on"); }));
  $("#tokenSave").onclick=()=>{ const v=$("#tokenInput").value.trim(); if(v)localStorage.setItem(LS_PAT,v); else localStorage.removeItem(LS_PAT); $("#tokenMask").classList.remove("on"); toast("保存しました"); };
  $("#copyUrl").onclick=async()=>{ try{ await navigator.clipboard.writeText($("#viewUrl").value); toast("コピーしました"); }catch(e){ $("#viewUrl").select(); document.execCommand("copy"); toast("コピーしました"); } };
  $("#addEntryBtn").onclick=addEntry;
  wireEditable();

  const params=new URLSearchParams(location.search);
  const view=params.get("view");

  if(view){
    readOnly=true;
    buildToolbar();
    $("#introEl").textContent="読み込み中…";
    try{ state=await fetchGist(view); }
    catch(e){ $("#introEl").textContent=e.message; state=defaultState(); }
  }else{
    gistId=localStorage.getItem(LS_GIST)||null;
    const saved=localStorage.getItem(LS_DATA);
    state = saved ? JSON.parse(saved) : defaultState();
    buildToolbar();
  }
  // migration safety
  state.tabs = (state.tabs||[]).map(t=>({id:t.id||uid(),name:t.name||"タブ",color:t.color||PALETTE[0],entries:(t.entries||[]).map(e=>({id:e.id||uid(),title:e.title||"",body:e.body||""}))}));
  if(!state.tabs.length) state=defaultState();

  render();
}


init();
</script>

<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = (m.name || "(無題)") + (here ? "" : " ↗");
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      if(cur && (cur.pages || []).length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){ /* 取得失敗時はメニュー空 */ });
})();
</script>
