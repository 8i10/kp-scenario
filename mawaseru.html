<style>
  /* ===== ダークモード変数（デフォルト） ===== */
  :root {
    --bg: #0d0d12;
    --surface: #16161f;
    --surface2: #1e1e2e;
    --border: #2a2a3d;
    --accent: #999999;
    --accent2: #7e9ec8;
    --text: #e8e4da;
    --text-muted: #8a8499;
    --r18: #c87e7e;
    --r15: #c8a97e;
    --all-age: #7ec87e;
    --red: #e05c5c;
    --header-bg1: #0d0d12;
    --header-bg2: #1a1428;
    --shadow: rgba(0,0,0,0.4);
    --modal-overlay: rgba(0,0,0,0.75);
    --hover-row: rgba(0,0,0,0.05);
    --scrollbar-thumb: #2a2a3d;
    --scrollbar-thumb-hover: #3a3a5a;
    --theme-icon: "🌙";
  }
  /* ===== ライトモード変数 ===== */
  body.light {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface2: #eeeeee;
    --border: #d4d4d4;
    --accent: #333333;
    --accent2: #666666;
    --text: #1a1a1a;
    --text-muted: #777777;
    --r18: #a04040;
    --r15: #333333;
    --all-age: #3a7a3a;
    --red: #c04040;
    --header-bg1: #f4f1ec;
    --header-bg2: #e8e8e8;
    --shadow: rgba(0,0,0,0.12);
    --modal-overlay: rgba(0,0,0,0.5);
    --hover-row: rgba(0,0,0,0.04);
    --scrollbar-thumb: #ccc;
    --scrollbar-thumb-hover: #aaa;
    --theme-icon: "☀️";
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }

  header {
    background: linear-gradient(135deg, var(--header-bg1) 0%, var(--header-bg2) 50%, var(--header-bg1) 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(0,0,0,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-left { flex: 1; min-width: 200px; }
  .header-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .header-sub {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }
  .pc-only { } /* デフォルト表示 */
  .sp-only { display: none; }
  .sp-header-row { display: none; }
  .header-count {
    display: inline-block;
    margin-top: 8px;
    background: rgba(0,0,0,0.1);
    border: 1px solid rgba(0,0,0,0.3);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.06em;
  }
  /* テーマ切替ボタン */
  .theme-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 15px;

<body class="light">

<div class="eth-fix">
  <header class="eth">
    <div class="eth-inner">
      <div class="eth-title">EITHIOPHILE</div>
      <div class="eth-navwrap">
        <button class="eth-navbtn" id="ethNavBtn" aria-label="メニュー">≡</button>
        <div class="eth-menu" id="ethNavMenu"></div>
      </div>
    </div>
  </header>
  <nav class="eth-tabbar" id="ethTabbar" style="display:none"><div class="eth-tabbar-inner" id="ethTabbarInner"></div></nav>
</div>



<div id="loadingBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(0,0,0,0.15);backdrop-filter:blur(4px);padding:10px;justify-content:center;align-items:center;gap:8px;font-size:13px;color:var(--accent);border-bottom:1px solid var(--border);">
  <span style="animation:spin 1s linear infinite;display:inline-block">⏳</span> 同期中…
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<header>
  <div class="header-inner">
    <div>
      <div class="header-title"></div>
      <div class="header-sub">TRPG / CoC6th Scenario Library</div>
    </div>
    <div class="header-btns">
      <button class="add-btn" onclick="openAddModal()">＋ 追加</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <!-- PC: 1行。スマホ: 2行に分割 -->
    <div class="sp-search-row" style="display:contents">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="シナリオ名で検索…">
      </div>
      <div class="result-info"><span id="resultCount">0</span> 件</div>
    </div>
    <div class="sp-filter-row" style="display:contents">
      <div class="filter-group">
        <span class="filter-label">レーティング</span>
        <select id="ratingFilter">
          <option value="">すべて</option>
          <option value="全年齢">全年齢</option>
          <option value="R15">R15</option>
          <option value="R18">R18</option>
          <option value="R18+G">R18+G</option>
          <option value="R18G">R18G</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">人数</span>
        <select id="ninzuFilter">
          <option value="">すべて</option>
          <option value="1PL">1PL</option>
          <option value="タイマン">タイマン</option>
          <option value="タイマンor2PL">タイマンor2PL</option>
          <option value="2PL">2PL</option>
          <option value="3PL">3PL</option>
          <option value="4PL">4PL</option>
          <option value="5PL以上">5PL以上</option>
          <option value="複数人">複数人</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">部屋</span>
        <select id="heyaFilter">
          <option value="">すべて</option>
          <option value="check">✓ あり</option>
          <option value="dash">- なし</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="main" id="mainArea"></div>
<div id="spCardList" style="display:none;flex-direction:column;gap:6px;padding:8px 8px 60px;"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body">
      <div id="modalRows"></div>
      <div id="modalGenreBox"></div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center;justify-content:space-between;">
        <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener">BOOTHで確認 →</a>
        <button class="edit-btn" id="modalEditBtn" onclick="openEditModal()">✏️ 編集</button>
      </div>
    </div>
  </div>
</div>

<!-- ログインモーダル -->
<div class="modal-overlay" id="loginOverlay" onclick="closeLoginOverlay(event)">
  <div class="modal" id="loginModal" style="max-width:380px">
    <div class="modal-head" style="padding:18px 24px 0;position:relative">
      <div class="modal-title" id="loginModalTitle">ログイン</div>
      <button class="modal-close" onclick="closeLoginDirect()">✕</button>
    </div>
    <div class="modal-body" id="loginBody">
      <div class="form-group" style="margin-top:4px">
        <label class="form-label">メールアドレス</label>
        <input class="form-input" id="loginEmail" type="email" placeholder="example@mail.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <div style="position:relative">
          <input class="form-input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:40px">
          <button onclick="togglePassVis()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px" id="passVisBtn">👁</button>
        </div>
      </div>
      <div id="loginErr" style="color:var(--r18);font-size:12px;margin-bottom:8px;display:none"></div>
      <div class="form-actions" style="margin-top:12px">
        <button class="btn-cancel" onclick="closeLoginDirect()">キャンセル</button>
        <button class="btn-save" onclick="doLogin()">ログイン</button>
      </div>
    </div>
  </div>
</div>

<!-- トークン設定モーダル -->
<div class="modal-overlay" id="tokenOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal" style="max-width:400px">
    <div class="modal-head" style="padding:18px 24px 0;position:relative">
      <div class="modal-title">GitHub Token設定</div>
      <button class="modal-close" onclick="document.getElementById('tokenOverlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Personal Access Token（repo権限）を入力してください。このデバイスのみに保存されます。</p>
      <div class="form-group">
        <label class="form-label">GitHub Token</label>
        <input class="form-input" id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="document.getElementById('tokenOverlay').classList.remove('open')">キャンセル</button>
        <button class="btn-save" onclick="saveToken()">保存</button>
      </div>
    </div>
  </div>
</div>
<!-- 編集/追加フォームモーダル -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditOverlay(event)">
  <div class="modal" id="editModal" style="max-width:520px">

</div>

let isDark = false;
let sortKey = '_idx';
let sortDir = -1;
let filtered = [];

// ⛩マーク or 🐔有 → 部屋フラグ「✓」
function heyaCheck(row) {
  const icons = row['🔰/🚩/🎥/🐔'] || '';
  return icons.includes('⛩') || icons.includes('🐔有');
}

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  const emoji = isDark ? '🌙' : '☀️';
  ['themeBtn','themeBtnSp'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.textContent = emoji;
  });
}

function getRatingClass(r) {
  if (r === '全年齢') return 'rating-all';
  if (r === 'R15') return 'rating-r15';
  if (r === 'R18') return 'rating-r18';
  return 'rating-r18g';
}

function ninzuMatch(row, val) {
  if (!val) return true;
  const n = row['人数'] || '';
  if (val === 'タイマン') return n === 'タイマン';
  if (val === 'タイマンor2PL') return n === 'タイマンor2PL' || n === '1PL, タイマンor2PL';
  if (val === '5PL以上') return /[5-9]PL|6PL|7PL/.test(n);
  if (val === '複数人') return n.includes('複数人');
  return n.includes(val);
}



function render() {
  const area = document.getElementById('mainArea');
  if (!area) return;
  if (filtered.length === 0) {
    area.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">該当するシナリオが見つかりません</div></div>';
    updateTheadTop();
    return;
  }
  renderTable(area);
}

function renderTable(area) {
  const cols = [
    { key: 'レーティング', label: 'R', sortable: true },
    { key: '名前', label: 'シナリオ名', sortable: true },
    { key: 'kp_num', label: 'KP回数', sortable: true },
    { key: '人数', label: '人数', sortable: true },
    { key: 'heya', label: '部屋', sortable: false },
    { key: '要相談', label: '要相談', sortable: false },
  ];

  let thHtml = cols.map(c => {
    let cls = '';
    if (c.key === sortKey) cls = sortDir === 1 ? 'sort-asc' : 'sort-desc';
    const onclick = c.sortable ? `onclick="setSort('${c.key}')"` : '';
    const thStyle = c.key === '人数' ? ' style="text-align:center"' : '';
    return `<th class="${cls}"${thStyle} ${onclick}>${c.label}</th>`;
  }).join('');

  let tbHtml = filtered.map(row => {
    const rating = row['レーティング'] || '全年齢';
    const kp = row.kp_num;
    const heya = heyaCheck(row);
    const sodan = row['要相談'] ? '要相談' : '';
    const rowData = JSON.stringify(row).replace(/"/g,'&quot;');
    const url = (row['シナリオURL']||'').trim();
    return `<tr onclick="openModal(${rowData})" style="cursor:pointer">
      <td class="td-rating"><span class="rating-badge ${getRatingClass(rating)}">${rating || '全年齢'}</span></td>
      <td class="td-name"><button class="name-btn" onclick="openModal(${rowData})">${row['名前']}</button></td>
      <td class="td-kp${kp>=5?' many':''}">#${kp}</td>
      <td class="td-ninzu">${row['人数']||'—'}</td>
      <td class="td-heya">${heya ? '<span class="heya-check">✓</span>' : '<span class="heya-dash">-</span>'}</td>
      <td class="td-sodan">${sodan}</td>
    </tr>`;
  }).join('');

  area.innerHTML = `<div class="scrollable-table" id="scrollTable"><table><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>`;
  // scrollable-tableの高さをコントロールバー分調整
  const st = document.getElementById('scrollTable');
  if (st) st.style.height = `calc(100vh - ${document.querySelector('.controls').offsetHeight + 60}px)`;
}

function setSort(key) {
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = -1; }
  applyFiltersFromData();
}

function openModal(row) {
  document.getElementById('modalTitle').textContent = row['名前'];

  const rating = row['レーティング'] || '全年齢';
  const heya = heyaCheck(row);
  const sodan = row['要相談'] || '';
  const memo = row['memo'] || '';
  const genre = row['ジャンル(主観)'] || '';
  const comment = row['comment'] || '';
  const date = (row['作成日時'] || '').replace(/\s+\d+:\d+$/, ''); // 時刻除去

  // レーティング ＋ システム（横並び）
  const row1 = `<div class="modal-pair">
    <div class="modal-cell"><span class="modal-label">レーティング</span><span class="modal-val"><span class="rating-badge ${getRatingClass(rating)}">${rating}</span></span></div>
    <div class="modal-cell"><span class="modal-label">システム</span><span class="modal-val">${row['システム'] || 'CoC6th'}</span></div>
  </div>`;

  // 人数 ＋ KP回数（横並び）
  const row2 = `<div class="modal-pair">
    <div class="modal-cell"><span class="modal-label">人数</span><span class="modal-val">${row['人数'] || '—'}</span></div>
    <div class="modal-cell"><span class="modal-label">KP回数</span><span class="modal-val">${row['KP回数'] || '—'}</span></div>
  </div>`;

  // 部屋 ＋ 要相談（横並び）
  const sodanPart = sodan ? `<span class="modal-sodan-badge">要相談</span>` : '';
  const row3 = `<div class="modal-pair">
    <div class="modal-cell"><span class="modal-label">部屋</span><span class="modal-val">${heya ? '<span class="heya-check">✓</span>' : '<span class="heya-dash">-</span>'}</span></div>
    <div class="modal-cell">${sodanPart}</div>
  </div>`;

  // ジャンル（あれば）
  const genreHtml = genre ? `<div class="modal-row"><span class="modal-label">ジャンル</span><span class="modal-val" style="color:#a07ec8">${genre}</span></div>` : '';

  // メモ（常に表示）
  const memoHtml = `<div class="modal-row"><span class="modal-label">メモ</span><span class="modal-memo-val">${memo}</span></div>`;

  // 一言コメント（アコーディオン）
  const commentHtml = comment ? `<div class="modal-comment-acc">
    <button class="comment-toggle" onclick="this.parentElement.classList.toggle('open')">💬 一言コメント <span class="comment-arrow">▼</span></button>
    <div class="comment-body">${comment.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
  </div>` : '';

  // 追加日
  const dateHtml = `<div class="modal-row"><span class="modal-label">追加日</span><span class="modal-val">${date || '—'}</span></div>`;

  document.getElementById('modalRows').innerHTML = row1 + row2 + row3 + genreHtml + memoHtml + commentHtml + dateHtml;
  document.getElementById('modalGenreBox').innerHTML = '';

  const link = document.getElementById('modalLink');
  const url = (row['シナリオURL'] || '').trim();
  const unavail = ['未公開', '非公開', '非公開？', '公開終了', 'BOOTHのではない'];
  if (url && !unavail.includes(url) && url.startsWith('http')) {
    link.href = url;
    link.style.display = '';
  } else {
    link.style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

document.getElementById('searchInput').addEventListener('input', applyFiltersFromData);
document.getElementById('ratingFilter').addEventListener('change', applyFiltersFromData);
document.getElementById('ninzuFilter').addEventListener('change', applyFiltersFromData);
document.getElementById('heyaFilter').addEventListener('change', applyFiltersFromData);

// コントロールバーの高さをCSS変数にセット
function updateTheadTop() {
  const h = document.querySelector('.controls').offsetHeight;
  document.documentElement.style.setProperty('--controls-h', h + 'px');
  const st = document.getElementById('scrollTable');
  if (st) st.style.height = `calc(100vh - ${h + 60}px)`;
}
window.addEventListener('resize', updateTheadTop);

// ①ライト初期適用
document.body.classList.add('light');

function updateTotalCount() {
  const t = `全 ${DATA.length} シナリオ`;
  ['totalCount','totalCountSp'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = t;
  });
}

const GH_REPO    = '8i10/kp-scenario';
const GH_BRANCH  = 'main';
const GH_FILE    = 'data.json';
const GH_API     = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
const GH_TOKEN_KEY = 'gh_token_v1';

function getGHToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function saveGHToken(t) { localStorage.setItem(GH_TOKEN_KEY, t); }

// GH APIヘッダー
function ghHeaders(token) {
  return {
    'Authorization': 'token ' + token,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

// data.jsonのSHAを取得（更新時に必要）
async function getFileSha(token) {
  const res = await fetch(GH_API + '?ref=' + GH_BRANCH + '&t=' + Date.now(), { headers: ghHeaders(token) });
  if (res.status === 404) return null;
  const json = await res.json();
  return json.sha || null;
}

// data.jsonを読み込む
async function apiGet() {
  const token = getGHToken();
  // 未ログイン（閲覧者）は raw から取得＝APIレート制限を回避
  if (!token) {
    try {
      const r = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_FILE + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { const arr = JSON.parse(await r.text()); if (Array.isArray(arr)) return arr; }
    } catch (e) {}
  }
  // トークンあり（編集者）は Contents API で最新取得
  const headers = token ? ghHeaders(token) : { 'Accept': 'application/vnd.github.v3+json' };
  const res = await fetch(GH_API + '?t=' + Date.now(), { headers });
  if (!res.ok) return [];
  const json = await res.json();
  if (!json || typeof json.content !== 'string') return []; // content無し（制限超過等）は空扱い
  const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
  try { return JSON.parse(decoded); } catch (e) { return []; }
}

// data.jsonを書き込む（トークン必須）
async function apiSave(newData) {
  const token = getGHToken();
  if (!token) throw new Error('トークン未設定');
  const sha  = await getFileSha(token);
  const body = {
    message: 'Update data.json',
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))),
    branch: GH_BRANCH
  };
  if (sha) body.sha = sha;
  const res = await fetch(GH_API, {
    method: 'PUT',
    headers: ghHeaders(token),
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || 'GitHub API error');
  }
  return await res.json();
}

async function loadFromGitHub() {
  if (GH_REPO.includes('ここに')) {
    DATA = JSON.parse(JSON.stringify(SCENARIOS)).map((r,i) => ({...r, _idx: i}));
    updateTotalCount();
    applyFiltersFromData();
    return;
  }
  showLoading(true);
  try {
    const rows = await apiGet();
    if (Array.isArray(rows)) {
      // data.jsonが空（[]）でもSCENARIOSにフォールバックしない
      DATA = rows.map((r, i) => ({...r, _idx: i, kp_num: parseInt((r['KP回数']||'#0').replace('#',''))||0}));
    }
  } catch(e) {
    console.warn('GitHub取得失敗:', e);
  } finally {
    showLoading(false);
  }
  updateTotalCount();
  applyFiltersFromData();
}

    if (q) { const hay=(r['名前']+r['人数']).toLowerCase(); if(!hay.includes(q)) return false; }
    if (rating && r['レーティング'] !== rating) return false;
    if (!ninzuMatch(r, ninzu)) return false;
    if (heya === 'check' && !heyaCheck(r)) return false;
    if (heya === 'dash' && heyaCheck(r)) return false;
    return true;
  });
  filtered.sort((a, b) => {
    let av = (sortKey === 'kp_num' || sortKey === '_idx') ? (a[sortKey]??0) : (a[sortKey]||'').toLowerCase();

async function saveScenario() {
  const name = document.getElementById('f_name').value.trim();
  if (!name) { alert('シナリオ名を入力してください'); return; }
  const kpRaw = document.getElementById('f_kp').value;
  const kpNum = parseInt(kpRaw) || 0;
  const kpStr = '#' + kpNum;
  // 新規IDを先に付与
  const isNew = editingIdx === null;
  const row = {
    'id': isNew ? Date.now().toString() : (DATA[editingIdx].id || Date.now().toString()),
    '名前': name,
    'レーティング': document.getElementById('f_rating').value,
    'システム': document.getElementById('f_system').value.trim(),
    '人数': (document.getElementById('f_ninzu').value === '__custom__' ? document.getElementById('f_ninzu_custom').value.trim() : document.getElementById('f_ninzu').value) || '',
    'KP回数': kpStr,
    'シナリオURL': document.getElementById('f_url').value.trim(),
    'ジャンル(主観)': currentGenres.join(', '),
    '要相談': document.getElementById('f_sodan').checked ? '要相談' : '',
    'memo': document.getElementById('f_memo').value.trim(),
    'comment': document.getElementById('f_comment').value.trim(),
    '🔰/🚩/🎥/🐔': (() => { const h = document.getElementById('f_heya').checked; const base = isNew ? '' : (DATA[editingIdx]['🔰/🚩/🎥/🐔'] || ''); if (h && !base.includes('⛩')) return (base ? base + ', ' : '') + '⛩'; if (!h) return base.replace(/,?\s*⛩/g,'').replace(/,?\s*🐔有/g,'').trim(); return base; })(),
    'BOOTH画像リンク': isNew ? '' : (DATA[editingIdx]['BOOTH画像リンク'] || ''),
    '作成日時': isNew ? new Date().toLocaleDateString('ja-JP') : DATA[editingIdx]['作成日時'],
    'kp_num': kpNum,
    '_idx': isNew ? (DATA.length > 0 ? Math.max(...DATA.map(r => r._idx ?? 0)) + 1 : 0) : DATA[editingIdx]._idx
  };
  // DATAを更新
  if (isNew) {
    DATA.push(row);
  } else {
    DATA[editingIdx] = row;
  }
  closeEditDirect();
  document.getElementById('modalOverlay').classList.remove('open');
  // GitHub API保存
  const token = getGHToken();
  if (!token) {
    alert('🔑 トークンを設定してください（ログイン後に表示されるボタンから）');
    updateTotalCount();
    applyFiltersFromData();
    return;
  }
  showLoading(true);
  try {
    await apiSave(DATA);
    await loadFromGitHub();
  } catch(e) {
    alert('保存失敗: ' + e.message);
    console.error(e);
    updateTotalCount();
    applyFiltersFromData();
  }
  showLoading(false);
}

// ===== 認証システム =====
// ユーザーDB: localStorage に 'trpg_users' キーで保存（{email: hashedPass}）
// ログイン状態: localStorage に 'trpg_session' キーで保存（{email, token}）

const SESS_KEY  = 'trpg_session_v2';
const ALLOWED_EMAIL = 'cracktrackxxxx@gmail.com';
const PASS_KEY = 'trpg_pass_v2';
let currentUser = null;

async function hashPass(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str + 'trpg_salt_9x'));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function getSavedHash() { return localStorage.getItem(PASS_KEY) || null; }
function savePassHash(h) { localStorage.setItem(PASS_KEY, h); }
function getSession() {
  try { return JSON.parse(localStorage.getItem(SESS_KEY) || 'null'); } catch { return null; }
}
function saveSession(s) { localStorage.setItem(SESS_KEY, JSON.stringify(s)); }

// 起動時の自動ログイン
(function autoLogin() {
  const s = getSession();
  if (!s) return;
  if (s.email === ALLOWED_EMAIL) {
    currentUser = s.email;
    updateAuthUI();
  } else {
    localStorage.removeItem(SESS_KEY);
  }
})();

function showLoginErr(msg) {
  const el = document.getElementById('loginErr');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

async function doLogin() {
  const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
  const pass  = (document.getElementById('loginPass').value  || '');
  if (!email || !pass) { showLoginErr('メールアドレスとパスワードを入力してください'); return; }
  if (email !== ALLOWED_EMAIL) { showLoginErr('このメールアドレスは登録されていません'); return; }
  if (pass.length < 4) { showLoginErr('パスワードは4文字以上で入力してください'); return; }
  const h = await hashPass(pass);
  const saved = getSavedHash();
  if (!saved) {
    savePassHash(h); // 初回：パスワードを設定
  } else if (saved !== h) {
    showLoginErr('パスワードが違います');
    return;
  }
  const token = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now();
  saveSession({ email, token });
  currentUser = email;
  updateAuthUI();
  closeLoginDirect();
  if (loginCallback) { const cb = loginCallback; loginCallback = null; cb(); }
}


function doLogout() {
  localStorage.removeItem(SESS_KEY);
  currentUser = null;
  updateAuthUI();
}

function togglePassVis() {
  const p = document.getElementById('loginPass');
  const btn = document.getElementById('passVisBtn');
  if (!p) return;
  p.type = p.type === 'password' ? 'text' : 'password';
  if (btn) btn.textContent = p.type === 'password' ? '👁' : '🙈';
}

function closeLoginOverlay(e) {
  if (e.target === document.getElementById('loginOverlay')) closeLoginDirect();
}
function closeLoginDirect() {
  loginCallback = null;
  document.getElementById('loginOverlay').classList.remove('open');
}

// ===== ジャンルタグ管理 =====
const GENRE_PRESETS = ['SAN回復','うちよそ','お別れ','刑事','初対面限定','同ｼﾅﾘｵ探索者可','後遺症回復','技能減少','救済要素:有','救済要素:無','新規限定','確定ﾛｽﾄ','継続限定','ｱｳﾄﾛｰ','ﾛｽﾄ探索者可','ﾛｽﾄ救済'];
let currentGenres = [];

function initGenreTags(str) {
  currentGenres = (str || '').split(/[,、]/).map(s=>s.trim()).filter(Boolean);
  renderGenreTags();
  renderGenreSuggest();
}
function renderGenreTags() {
  const box = document.getElementById('genreTags');
  if (!box) return;
  box.innerHTML = currentGenres.map((g,i)=>`<span class="genre-tag">${g}<button type="button" onclick="removeGenreTag(${i})">✕</button></span>`).join('');
}
function renderGenreSuggest() {
  const box = document.getElementById('genreSuggest');
  if (!box) return;
  const remain = GENRE_PRESETS.filter(g=>!currentGenres.includes(g));
  box.innerHTML = remain.map(g=>`<span class="genre-suggest-item" onclick="addGenreTag('${g}')">+ ${g}</span>`).join('');
}
function addGenreTag(tag) {
  tag = (tag||'').trim();
  if (!tag || currentGenres.includes(tag)) return;
  currentGenres.push(tag);
  renderGenreTags();
  renderGenreSuggest();
}
function removeGenreTag(i) {
  currentGenres.splice(i,1);
  renderGenreTags();
  renderGenreSuggest();
}

// ===== スマホカード表示 =====
function isSp() { return window.innerWidth <= 640; }

function renderSpCards() {
  const list = document.getElementById('spCardList');
  if (!list) return;
  list.innerHTML = filtered.map(row => {
    const rating = row['レーティング'] || '全年齢';
    const kp = row.kp_num;
    const heya = heyaCheck(row);
    const sodan = row['要相談'] ? `<span style="color:var(--r18);font-size:10px">要相談</span>` : '';
    const heyaHtml = heya
      ? '<span style="color:var(--heya-check,#5a9a5a);font-weight:700">✓</span>'
      : '<span style="color:var(--text-muted)">—</span>';
    const rowData = JSON.stringify(row).replace(/"/g,'&quot;');
    return `<div class="sp-card" onclick="openModal(${rowData})">
      <div class="sp-card-row1">
        <span class="rating-badge ${getRatingClass(rating)}">${rating}</span>
        <span class="sp-card-name">${row['名前']}</span>
      </div>
      <div class="sp-card-row2">
        ${sodan ? `<span class="sp-card-sodan">${row['要相談']}</span>` : '<span></span>'}
        <span class="sp-c-right">
          <span class="sp-c-ninzu">${row['人数']||'—'}</span>
          <span class="sp-c-kp">#${kp}</span>
          <span class="sp-c-heya">${heyaHtml}</span>
        </span>
      </div>
    </div>`;
  }).join('');
}


// コントロールレイアウト切替
function applySpLayout() {
  const sp = isSp();
  const sr = document.querySelector('.sp-search-row');
  const fr = document.querySelector('.sp-filter-row');
  if (sr) sr.style.display = sp ? 'flex' : 'contents';
  if (fr) fr.style.display = sp ? 'flex' : 'contents';
}
applySpLayout();

window.addEventListener('resize', () => {
  applySpLayout();
  updateTheadTop();
  // 現在のフィルタ状態で再描画
  if (typeof filtered !== 'undefined') render();
});


function openTokenModal() {
  document.getElementById('tokenInput').value = getGHToken();
  document.getElementById('tokenOverlay').classList.add('open');
}
function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) { alert('トークンを入力してください'); return; }
  saveGHToken(t);
  document.getElementById('tokenOverlay').classList.remove('open');
  updateAuthUI();
  loadFromGitHub();
}


// 編集モード時：閲覧用URL発行ボタンを表示
if (IS_EDIT_MODE) {
  const headerBtns = document.querySelector('.header-btns');
  const makeShareBtn = () => {
    const b = document.createElement('button');
    b.className = 'add-btn';
    b.textContent = '🔗 閲覧用URL';
    b.onclick = copyViewUrl;
    return b;
  };
  if (headerBtns) headerBtns.insertBefore(makeShareBtn(), headerBtns.firstChild);
}
function copyViewUrl() {
  const url = location.origin + location.pathname; // editパラメータなし
  navigator.clipboard.writeText(url).then(() => {
    alert('閲覧用URLをコピーしました:\n' + url);
  }).catch(() => {
    prompt('閲覧用URL（コピーしてください）', url);
  });
}

<script>
/* ===== 共通ヘッダー（大ページ ≡メニュー / 小ページタブ） ===== */
(function(){
  var REPO   = "8i10/kp-scenario";
  var BRANCH = "main";
  var JSON_URL = "https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/profile.json";
  var HOME = "index.html";
  var EDIT = new URLSearchParams(location.search).get("edit") === "1";
  var SELF = (location.pathname.split("/").pop() || "index.html").toLowerCase();

  function withEdit(u){
    if(!EDIT) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "edit=1";
  }
  function fileOf(u){ return String(u||"").split("?")[0].split("/").pop().toLowerCase(); }
  function isSelf(u){ return !!u && fileOf(u) === SELF; }

  var menu = document.getElementById("ethNavMenu");
  var btn  = document.getElementById("ethNavBtn");
  function closeMenu(){ menu.classList.remove("open"); }
  btn.addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  document.addEventListener("click", function(e){
    var w = document.querySelector(".eth-navwrap");
    if(w && !w.contains(e.target)) closeMenu();
  });

  function majorHref(m){
    if(m.url) return withEdit(m.url);
    var ps = m.pages || [];
    if(ps.length && ps.every(function(p){ return !!p.url; })) return withEdit(ps[0].url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || ""));
  }
  function pageHref(m, p){
    if(p.url) return withEdit(p.url);
    return withEdit(HOME + "?major=" + encodeURIComponent(m.id || "") + "&page=" + encodeURIComponent(p.id || ""));
  }

  var CACHE_KEY = "eth_profile_cache_v1";
  function readCache(){
    try{ var s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }
  }
  function writeCache(j){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(j)); }catch(e){}
  }
  fetch(JSON_URL + "?t=" + Date.now())
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && Array.isArray(j.majors)) writeCache(j);
      else j = readCache();               /* 取得失敗時は前回の内容を使う */
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });

      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        var here = (cur && m.id === cur.id);
        b.className = "eth-mtab" + (here ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });

      var bar = document.getElementById("ethTabbar");
      var inner = document.getElementById("ethTabbarInner");
      inner.innerHTML = "";
      var _vis = (cur ? (cur.pages || []) : []).filter(function(p){ return !p.hidden; });
      if(cur && _vis.length > 1){
        bar.style.display = "";
        cur.pages.forEach(function(p){
          if(p.hidden) return;
          var b = document.createElement("button");
          b.className = "eth-tab" + (isSelf(p.url) ? " active" : "");
          b.textContent = p.name || "(無題)";
          b.addEventListener("click", function(){ location.href = pageHref(cur, p); });
          inner.appendChild(b);
        });
      }
    })
    .catch(function(){
      /* 通信自体が失敗 → 前回内容で描画 */
      var j = readCache();
      var majors = (j && Array.isArray(j.majors)) ? j.majors : [];
      if(!majors.length) return;
      var cur = null;
      majors.forEach(function(m){
        if(isSelf(m.url)) cur = m;
        (m.pages || []).forEach(function(p){ if(isSelf(p.url)) cur = m; });
      });
      menu.innerHTML = "";
      majors.forEach(function(m){
        if(m.hidden) return;
        var b = document.createElement("button");
        b.className = "eth-mtab" + ((cur && m.id === cur.id) ? " active" : "");
        b.textContent = m.name || "(無題)";
        b.addEventListener("click", function(){ closeMenu(); location.href = majorHref(m); });
        menu.appendChild(b);
      });
    });
})();
</script>

</body>
